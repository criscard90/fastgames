<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spirale Party 3D</title>
  
  <!-- Font Moderno Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- Three.js per il Dado 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --p1-color: #ef4444;
      --p1-glow: rgba(239, 68, 68, 0.5);
      --p2-color: #3b82f6;
      --p2-glow: rgba(59, 130, 246, 0.5);
      --text-color: #f8fafc;
      --accent-color: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .catalog {
      width: 100%;
      align-self: stretch;
      max-width: 760px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      padding: 18px 0;
    }

    .catalog-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .catalog-kicker {
      color: #a78bfa;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .catalog-title {
      font-size: clamp(2.7rem, 10vw, 5.5rem);
      line-height: 0.9;
      letter-spacing: 0.04em;
      font-weight: 800;
      color: #f8fafc;
    }

    .catalog-subtitle {
      max-width: 420px;
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.4;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
    }

    .game-card {
      position: relative;
      min-height: 230px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(51, 65, 85, 0.9), rgba(30, 41, 59, 0.9));
      color: var(--text-color);
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.24);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card::after {
      content: '';
      position: absolute;
      width: 150px;
      height: 150px;
      right: -48px;
      bottom: -64px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.35);
      filter: blur(4px);
    }

    .game-card-score::after {
      background: rgba(16, 185, 129, 0.3);
    }

    .game-card:hover,
    .game-card:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(167, 139, 250, 0.75);
      box-shadow: 0 22px 42px rgba(0, 0, 0, 0.35);
      outline: none;
    }

    .game-card-icon {
      position: relative;
      z-index: 1;
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      margin-bottom: 28px;
      border-radius: 16px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      font-size: 1.7rem;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }

    .game-card h2,
    .game-card p,
    .game-card-cta {
      position: relative;
      z-index: 1;
    }

    .game-card h2 {
      margin-bottom: 6px;
      font-size: 1.35rem;
    }

    .game-card p {
      max-width: 250px;
      color: #cbd5e1;
      line-height: 1.35;
    }

    .game-card-cta {
      position: absolute;
      right: 22px;
      bottom: 22px;
      color: #ddd6fe;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #gameView {
      width: 100%;
      align-self: stretch;
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
    }

    .game-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 520px;
      margin: 0 auto 2px;
      padding: 0 2px;
    }

    .back-button {
      border: 0;
      padding: 5px 0;
      background: transparent;
      color: #94a3b8;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .back-button:hover,
    .back-button:focus-visible {
      color: #f8fafc;
      outline: none;
    }

    .game-name {
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .turn-indicator {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .player-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .board-container {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      will-change: transform;
    }

    /* Effetto scossa dello schermo all'impatto del dado */
    .shake {
      animation: cameraShake 0.15s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes cameraShake {
      10%, 90% { transform: translate3d(-2px, 2px, 0); }
      20%, 80% { transform: translate3d(3px, -2px, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 4px, 0); }
      40%, 60% { transform: translate3d(4px, -3px, 0); }
    }

    canvas#boardCanvas {
      display: block;
      border-radius: 24px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .score-board {
      display: none;
      width: min(100%, 500px);
      padding: 24px 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      background: var(--card-bg);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .score-board.visible {
      display: block;
    }

    .score-board-heading {
      margin-bottom: 20px;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    .score-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .score-player {
      padding: 18px 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      text-align: center;
    }

    .score-player-label {
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .score-value {
      margin-top: 4px;
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
    }

    .score-value.p1 { color: var(--p1-color); }
    .score-value.p2 { color: var(--p2-color); }

    .action-choice {
      display: none;
      grid-area: actions;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .action-choice.visible {
      display: grid;
    }

    .action-button {
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      background: rgba(51, 65, 85, 0.8);
      color: #f8fafc;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .action-button:hover:not(:disabled),
    .action-button:focus-visible:not(:disabled) {
      border-color: var(--accent-color);
      outline: none;
    }

    .action-button:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .controls {
      width: 100%;
      max-width: 500px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "dice turn"
        "log log"
        "actions actions"
        "button button";
      align-items: center;
      gap: 2px 12px;
      margin-top: 2px;
    }

    .dice-control {
      grid-area: dice;
      display: flex;
      justify-content: center;
    }

    .turn-control {
      grid-area: turn;
      display: flex;
      justify-content: center;
    }

    /* Container 3D Dado con Shockwave Ripple Effect */
    #dice-container {
      width: 110px;
      height: 110px;
      cursor: pointer;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Anello d'urto illuminato all'impatto del dado */
    .shockwave {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 15px var(--accent-color);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.2);
    }

    .shockwave.active {
      animation: ripple 0.5s ease-out forwards;
    }

    @keyframes ripple {
      0% { opacity: 1; transform: scale(0.3); }
      100% { opacity: 0; transform: scale(3.2); }
    }

    .btn-roll {
      background: linear-gradient(135deg, var(--accent-color), #6366f1);
      color: #fff;
      border: none;
      padding: 10px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .btn-roll:active {
      transform: scale(0.95);
    }

    .btn-roll:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    #log {
      grid-area: log;
      font-size: 0.95rem;
      font-weight: 600;
      color: #94a3b8;
      height: 24px;
      text-align: center;
    }

    #actionChoice {
      width: 100%;
      max-width: 500px;
    }

    .btn-roll {
      grid-area: button;
    }

    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #1e293b;
      padding: 30px;
      border-radius: 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
      max-width: 320px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .modal-content h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .modal-content p {
      color: #94a3b8;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <main class="catalog" id="catalogView">
    <div class="catalog-header">
      <span class="catalog-kicker">Mini giochi, partite veloci</span>
      <h1 class="catalog-title">FAST GAMES</h1>
      <p class="catalog-subtitle">Scegli un gioco e inizia a giocare. Niente attese, solo il prossimo turno.</p>
    </div>

    <div class="game-grid">
      <button class="game-card" id="spiralGameCard" type="button">
        <span class="game-card-icon" aria-hidden="true">★</span>
        <h2>Spirale Party 3D</h2>
        <p>Una sfida a due tra bonus, malus e lanci di dado.</p>
        <span class="game-card-cta">Gioca ora →</span>
      </button>
      <button class="game-card game-card-score" id="scoreGameCard" type="button">
        <span class="game-card-icon" aria-hidden="true">21</span>
        <h2>Ventuno a scelta</h2>
        <p>Porta il tuo punteggio esattamente a 21, o rallenta l’avversario.</p>
        <span class="game-card-cta">Gioca ora →</span>
      </button>
    </div>
  </main>

  <main id="gameView">
    <div class="game-topbar">
      <button class="back-button" id="backToCatalog" type="button">← Tutti i giochi</button>
      <span class="game-name">Spirale Party 3D</span>
    </div>

    <div class="board-container">
      <canvas id="boardCanvas" width="800" height="800"></canvas>
      <section class="score-board" id="scoreBoard" aria-label="Punteggi della partita">
        <div class="score-board-heading">Primo a 21, senza superare</div>
        <div class="score-grid">
          <div class="score-player">
            <div class="score-player-label">Giocatore 1</div>
            <div class="score-value p1" id="scoreOne">0</div>
          </div>
          <div class="score-player">
            <div class="score-player-label">Giocatore 2</div>
            <div class="score-value p2" id="scoreTwo">0</div>
          </div>
        </div>
      </section>
    </div>

    <div class="controls">
      <div class="dice-control">
        <div id="dice-container">
          <div class="shockwave" id="shockwave"></div>
        </div>
      </div>
      <div class="turn-control">
        <div class="turn-indicator">
          <span class="player-dot" id="turnDot"></span>
          <span id="turnText">Turno Giocatore 1</span>
        </div>
      </div>
      <div id="log">Tocca il dado o il pulsante per tirare!</div>
      <div class="action-choice" id="actionChoice">
        <button class="action-button" id="addAction" type="button">+ A me</button>
        <button class="action-button" id="subtractAction" type="button">- Al rivale</button>
      </div>
      <button class="btn-roll" id="rollBtn">LANCIA IL DADO</button>
    </div>

    <div class="modal" id="winModal">
      <div class="modal-content">
        <h2 id="winTitle">VITTORIA!</h2>
        <p id="winDesc">Il perdente deve bere 2 shottini!</p>
        <button class="btn-roll" onclick="resetGame()">NUOVA PARTITA</button>
      </div>
    </div>
  </main>

  <script>
    // --- STATO DI GIOCO ---
    const TOTAL_TILES = 30;
    let playerPositions = [0, 0];
    let scores = [0, 0];
    let currentPlayer = 0;
    let tiles = [];
    let isRolling = false;
    let gameMode = 'spiral';
    let pendingScoreRoll = null;

    const playerColors = ['#ef4444', '#3b82f6'];
    const playerGlows = ['rgba(239, 68, 68, 0.6)', 'rgba(59, 130, 246, 0.6)'];

    // --- GENERAZIONE CASELLE SPECIALI ---
    function generateBoardTiles() {
      tiles = Array(TOTAL_TILES).fill(0);
      const specialCount = Math.floor(Math.random() * 3) + 6;
      let count = 0;
      
      while (count < specialCount) {
        let idx = Math.floor(Math.random() * (TOTAL_TILES - 4)) + 2;
        if (tiles[idx] === 0) {
          let val = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 2) + 1);
          tiles[idx] = val;
          count++;
        }
      }
    }

    // --- CANVAS & SPIRALE ---
    const canvas = document.getElementById('boardCanvas');
    const ctx = canvas.getContext('2d');
    let pathPoints = [];
    let drawScale = 1;

    // Adatta il canvas allo spazio disponibile (quadrato, nitido su mobile)
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const size = Math.max(120, Math.floor(Math.min(rect.width, rect.height)));
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const px = Math.round(size * dpr);
      if (canvas.width !== px) {
        canvas.width = px;
        canvas.height = px;
      }
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
    }

    function computeSpiralPoints() {
      pathPoints = [];
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const maxRadius = canvas.width * 0.42;
      const minRadius = canvas.width * 0.08;
      const turns = 2.5;

      for (let i = 0; i < TOTAL_TILES; i++) {
        let t = i / (TOTAL_TILES - 1);
        let angle = t * (turns * 2 * Math.PI) - Math.PI / 2;
        let radius = maxRadius - t * (maxRadius - minRadius);
        
        let x = centerX + radius * Math.cos(angle);
        let y = centerY + radius * Math.sin(angle);
        drawScale = canvas.width / 800;
        pathPoints.push({ x, y, radius: 22 * drawScale });
      }
    }

    function drawBoard() {
      const s = drawScale;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Tracciato spirale
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 6 * s;
      for (let i = 0; i < pathPoints.length; i++) {
        if (i === 0) ctx.moveTo(pathPoints[i].x, pathPoints[i].y);
        else ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
      }
      ctx.stroke();

      // Disegna caselle
      pathPoints.forEach((pt, idx) => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);

        if (idx === TOTAL_TILES - 1) {
          ctx.fillStyle = '#8b5cf6'; // Traguardo
        } else if (tiles[idx] > 0) {
          ctx.fillStyle = '#10b981'; // Bonus
        } else if (tiles[idx] < 0) {
          ctx.fillStyle = '#f59e0b'; // Malus
        } else {
          ctx.fillStyle = '#1e293b'; // Normale
        }

        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 2 * s;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold ' + Math.round(16 * s) + 'px Outfit';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        let text = (idx + 1).toString();
        if (tiles[idx] > 0) text = '+' + tiles[idx];
        if (tiles[idx] < 0) text = tiles[idx].toString();
        if (idx === TOTAL_TILES - 1) text = '★';

        ctx.fillText(text, pt.x, pt.y);
      });

      // Disegna Pedine
      playerPositions.forEach((posIdx, pIdx) => {
        let pt = pathPoints[posIdx];
        let offsetX = (pIdx === 0 ? -8 : 8) * s;
        let offsetY = (pIdx === 0 ? -8 : 8) * s;
        if (playerPositions[0] !== playerPositions[1]) {
          offsetX = 0; offsetY = 0;
        }

        ctx.beginPath();
        ctx.arc(pt.x + offsetX, pt.y + offsetY, 14 * s, 0, Math.PI * 2);
        ctx.fillStyle = playerColors[pIdx];
        ctx.shadowColor = playerColors[pIdx];
        ctx.shadowBlur = 12 * s;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2 * s;
        ctx.stroke();
        ctx.shadowBlur = 0;
      });
    }

    // --- DADO 3D FRENATURA ED EFFETTI FISICI ---
    let scene, camera, renderer, cube, shadowMesh;
    const diceContainer = document.getElementById('dice-container');
    const shockwaveEl = document.getElementById('shockwave');

    const diceRotations = {
      1: new THREE.Euler(0, -Math.PI / 2, 0),
      2: new THREE.Euler(0, Math.PI / 2, 0),
      3: new THREE.Euler(Math.PI / 2, 0, 0),
      4: new THREE.Euler(-Math.PI / 2, 0, 0),
      5: new THREE.Euler(0, 0, 0),
      6: new THREE.Euler(0, Math.PI, 0)
    };

    function createDiceTexture(number) {
      const dCanvas = document.createElement('canvas');
      dCanvas.width = 128;
      dCanvas.height = 128;
      const dCtx = dCanvas.getContext('2d');

      dCtx.fillStyle = '#ffffff';
      dCtx.fillRect(0, 0, 128, 128);
      dCtx.lineWidth = 8;
      dCtx.strokeStyle = '#cbd5e1';
      dCtx.strokeRect(0, 0, 128, 128);

      dCtx.fillStyle = '#0f172a';
      const dots = {
        1: [[64, 64]],
        2: [[36, 36], [92, 92]],
        3: [[36, 36], [64, 64], [92, 92]],
        4: [[36, 36], [36, 92], [92, 36], [92, 92]],
        5: [[36, 36], [36, 92], [64, 64], [92, 36], [92, 92]],
        6: [[36, 36], [36, 64], [36, 92], [92, 36], [92, 64], [92, 92]]
      };

      dots[number].forEach(([x, y]) => {
        dCtx.beginPath();
        dCtx.arc(x, y, 11, 0, Math.PI * 2);
        dCtx.fill();
      });

      return new THREE.CanvasTexture(dCanvas);
    }

    function init3DDice() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
      camera.position.z = 4.8;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(110, 110);
      diceContainer.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);

      // Ordine da 1 a 6 assegnato alle facce Three.js [+X, -X, +Y, -Y, +Z, -Z]
      const materials = [
        new THREE.MeshStandardMaterial({ map: createDiceTexture(1) }),
        new THREE.MeshStandardMaterial({ map: createDiceTexture(2) }),
        new THREE.MeshStandardMaterial({ map: createDiceTexture(3) }),
        new THREE.MeshStandardMaterial({ map: createDiceTexture(4) }),
        new THREE.MeshStandardMaterial({ map: createDiceTexture(5) }),
        new THREE.MeshStandardMaterial({ map: createDiceTexture(6) })
      ];

      const geometry = new THREE.BoxGeometry(1.6, 1.6, 1.6);
      cube = new THREE.Mesh(geometry, materials);
      scene.add(cube);

      // Ombra dinamica sotto il dado
      const shadowGeo = new THREE.PlaneGeometry(1.6, 1.6);
      const shadowMat = new THREE.MeshBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity: 0.3
      });
      shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
      shadowMesh.position.y = -1.5;
      shadowMesh.rotation.x = -Math.PI / 2;
      scene.add(shadowMesh);

      // Posizione iniziale
      cube.rotation.copy(diceRotations[5]);

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();
    }

    // --- ANIMAZIONE CAOTICA ESPLOSIVA 3D ---
    function rollDice3D(targetValue, callback) {
      let startTime = null;
      const duration = 1500; // 1.5s per una suspense caotica spettacolare

      const targetEuler = diceRotations[targetValue];
      const targetQuaternion = new THREE.Quaternion().setFromEuler(targetEuler);

      // Vettori di rotazione caotici e imprevedibili
      const randX = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 4) + 8) * Math.PI;
      const randY = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 4) + 8) * Math.PI;
      const randZ = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 3) + 4) * Math.PI;

      const initialQuat = cube.quaternion.clone();

      // Direzione di "schizzata" casuale sull'asse X/Z durante il volo
      const driftX = (Math.random() - 0.5) * 2.2;
      const driftZ = (Math.random() - 0.5) * 1.5;

      let impactTriggered = false;
      const boardContainer = document.querySelector('.board-container');

      function animateRoll(timestamp) {
        if (!startTime) startTime = timestamp;
        let progress = (timestamp - startTime) / duration;

        if (progress < 1) {
          // 1. ROTAZIONE CAOTICA CON FRENATA SULLA FINE
          let rotProgress = Math.pow(progress, 0.8);
          let currentX = THREE.MathUtils.lerp(0, randX, 1 - rotProgress);
          let currentY = THREE.MathUtils.lerp(0, randY, 1 - rotProgress);
          let currentZ = THREE.MathUtils.lerp(0, randZ, 1 - rotProgress);

          let spinQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(currentX, currentY, currentZ));
          // FIX r128: slerpQuaternions() non ritorna this, quindi non si puo' concatenare.
          // Si usa copy() + slerp() che ritornano il quaternion.
          let animQuat = new THREE.Quaternion().copy(initialQuat).slerp(targetQuaternion, Math.pow(progress, 2.5));
          cube.quaternion.multiplyQuaternions(animQuat, spinQuat);

          // 2. FISICA DI SALTO, SCHIZZATA LATERALE E RIMBALZI MULTIPLI
          let yPos = 0;
          let tiltAngle = 0;

          if (progress < 0.5) {
            // Salto principale
            let p1 = progress / 0.5;
            yPos = Math.sin(p1 * Math.PI) * 2.5;
          } else if (progress < 0.75) {
            // Primo rimbalzo storto (il dado colpisce di spigolo)
            let p2 = (progress - 0.5) / 0.25;
            yPos = Math.sin(p2 * Math.PI) * 0.8;
            tiltAngle = Math.sin(p2 * Math.PI) * 0.4;
          } else if (progress < 0.9) {
            // Secondo rimbalzo smorzato
            let p3 = (progress - 0.75) / 0.15;
            yPos = Math.sin(p3 * Math.PI) * 0.25;
            tiltAngle = Math.sin(p3 * Math.PI) * 0.15;
          }

          // Traiettoria X/Z devia e rientra
          let driftFactor = Math.sin(progress * Math.PI);
          cube.position.x = driftX * driftFactor;
          cube.position.z = driftZ * driftFactor;
          cube.position.y = yPos;

          if (tiltAngle !== 0) {
            cube.rotation.z += tiltAngle;
          }

          // Ombra dinamica
          let shadowScale = Math.max(0.2, 1 - (yPos / 3.0));
          shadowMesh.position.x = cube.position.x;
          shadowMesh.position.z = cube.position.z;
          shadowMesh.scale.set(shadowScale, shadowScale, 1);
          shadowMesh.material.opacity = 0.4 * shadowScale;

          // 3. IMPATTO (Shockwave + Camera Shake)
          if (progress >= 0.48 && !impactTriggered) {
            triggerShockwave();
            
            boardContainer.classList.remove('shake');
            void boardContainer.offsetWidth;
            boardContainer.classList.add('shake');

            impactTriggered = true;
          }

          requestAnimationFrame(animateRoll);
        } else {
          // Stabilizzazione finale millimetrica
          cube.position.set(0, 0, 0);
          shadowMesh.position.set(0, -1.5, 0);
          shadowMesh.scale.set(1, 1, 1);
          shadowMesh.material.opacity = 0.3;
          cube.quaternion.copy(targetQuaternion);
          
          callback();
        }
      }
      requestAnimationFrame(animateRoll);
    }

    function triggerShockwave() {
      shockwaveEl.classList.remove('active');
      void shockwaveEl.offsetWidth; // Force Reflow
      shockwaveEl.classList.add('active');
    }

    // --- LOGICA DEL GIOCO ---
    const rollBtn = document.getElementById('rollBtn');
    const logEl = document.getElementById('log');
    const actionChoice = document.getElementById('actionChoice');
    const addAction = document.getElementById('addAction');
    const subtractAction = document.getElementById('subtractAction');

    function updateScores() {
      document.getElementById('scoreOne').innerText = scores[0];
      document.getElementById('scoreTwo').innerText = scores[1];
    }

    function updateTurnUI() {
      const dot = document.getElementById('turnDot');
      const text = document.getElementById('turnText');
      dot.style.backgroundColor = playerColors[currentPlayer];
      dot.style.boxShadow = `0 0 10px ${playerGlows[currentPlayer]}`;
      text.innerText = `Turno Giocatore ${currentPlayer + 1}`;
    }

    function handleTurn() {
      if (isRolling) return;

      if (gameMode === 'score') {
        handleScoreRoll();
        return;
      }

      isRolling = true;
      rollBtn.disabled = true;

      const diceResult = Math.floor(Math.random() * 6) + 1;
      logEl.innerText = `Giocatore ${currentPlayer + 1} sta lanciando...`;

      rollDice3D(diceResult, () => {
        let currentPos = playerPositions[currentPlayer];
        let distanceNeeded = (TOTAL_TILES - 1) - currentPos;

        // --- REGOLA TRAGUARDO ESATTO ---
        if (diceResult > distanceNeeded) {
          logEl.innerText = `Uscito ${diceResult}! Serviva ${distanceNeeded}. Tiro non valido: rimani fermo!`;
          setTimeout(() => {
            checkWinOrNext(false);
          }, 1500);
        } else {
          logEl.innerText = `Uscito ${diceResult}! Avanzi di ${diceResult} caselle.`;
          
          movePlayer(currentPlayer, diceResult, () => {
            resolveTileEffects(currentPlayer, () => checkWinOrNext(true));
          });
        }
      });
    }

    function handleScoreRoll() {
      isRolling = true;
      rollBtn.disabled = true;
      actionChoice.classList.remove('visible');

      const diceResult = Math.floor(Math.random() * 6) + 1;
      pendingScoreRoll = diceResult;
      logEl.innerText = `Giocatore ${currentPlayer + 1} sta lanciando...`;

      rollDice3D(diceResult, () => {
        const canAdd = scores[currentPlayer] + diceResult <= 21;
        addAction.disabled = !canAdd;
        subtractAction.disabled = false;
        actionChoice.classList.add('visible');
        logEl.innerText = canAdd
          ? `È uscito ${diceResult}: scegli dove usarlo.`
          : `È uscito ${diceResult}: non puoi superare 21, scegli il malus.`;
      });
    }

    function applyScoreAction(action) {
      if (pendingScoreRoll === null) return;

      const diceResult = pendingScoreRoll;
      const opponent = currentPlayer === 0 ? 1 : 0;
      if (action === 'add') {
        if (scores[currentPlayer] + diceResult > 21) return;
        scores[currentPlayer] += diceResult;
        logEl.innerText = `+${diceResult} al punteggio del Giocatore ${currentPlayer + 1}.`;
      } else {
        scores[opponent] = Math.max(0, scores[opponent] - diceResult);
        logEl.innerText = `-${diceResult} al punteggio del Giocatore ${opponent + 1}.`;
      }

      pendingScoreRoll = null;
      actionChoice.classList.remove('visible');
      updateScores();

      if (scores[currentPlayer] === 21) {
        showWinModal(currentPlayer + 1);
        return;
      }

      currentPlayer = currentPlayer === 0 ? 1 : 0;
      updateTurnUI();
      isRolling = false;
      rollBtn.disabled = false;
    }

    function resolveTileEffects(pIdx, callback, visitedTiles = new Set()) {
      const currentPos = playerPositions[pIdx];
      const modifier = tiles[currentPos];

      if (modifier === 0 || visitedTiles.has(currentPos)) {
        callback();
        return;
      }

      visitedTiles.add(currentPos);
      setTimeout(() => {
        const actionText = modifier > 0
          ? `Bonus! +${modifier} caselle`
          : `Malus! ${modifier} caselle (BEVI!)`;
        logEl.innerText = actionText;

        let targetPos = currentPos + modifier;
        if (targetPos < 0) targetPos = 0;
        if (targetPos >= TOTAL_TILES - 1) targetPos = TOTAL_TILES - 1;
        const realSteps = targetPos - currentPos;

        movePlayer(pIdx, realSteps, () => {
          resolveTileEffects(pIdx, callback, visitedTiles);
        });
      }, 600);
    }

    function movePlayer(pIdx, steps, callback) {
      if (steps === 0) {
        callback();
        return;
      }

      let targetPos = playerPositions[pIdx] + steps;
      if (targetPos < 0) targetPos = 0;
      if (targetPos >= TOTAL_TILES - 1) targetPos = TOTAL_TILES - 1;

      let currentPos = playerPositions[pIdx];
      let stepDirection = steps > 0 ? 1 : -1;

      let interval = setInterval(() => {
        if (currentPos !== targetPos) {
          currentPos += stepDirection;
          playerPositions[pIdx] = currentPos;
          drawBoard();
        } else {
          clearInterval(interval);
          callback();
        }
      }, 200);
    }

    function checkWinOrNext(hasMoved) {
      if (playerPositions[currentPlayer] === TOTAL_TILES - 1) {
        showWinModal(currentPlayer + 1);
      } else {
        currentPlayer = currentPlayer === 0 ? 1 : 0;
        updateTurnUI();
        isRolling = false;
        rollBtn.disabled = false;
      }
    }

    function showWinModal(winner) {
      const modal = document.getElementById('winModal');
      const title = document.getElementById('winTitle');
      const desc = document.getElementById('winDesc');
      const loser = winner === 1 ? 2 : 1;

      title.innerText = `GIOCATORE ${winner} VINCE!`;
      title.style.color = playerColors[winner - 1];
      desc.innerText = `Il Giocatore ${loser} deve pagare la penitenza e BERE! 🍻`;
      modal.classList.add('active');
    }

    function resetGame() {
      playerPositions = [0, 0];
      scores = [0, 0];
      currentPlayer = 0;
      isRolling = false;
      pendingScoreRoll = null;
      rollBtn.disabled = false;
      document.getElementById('winModal').classList.remove('active');
      actionChoice.classList.remove('visible');
      addAction.disabled = false;
      subtractAction.disabled = false;
      logEl.innerText = gameMode === 'score'
        ? 'Nuova partita: porta il tuo punteggio a 21!'
        : 'Nuova partita iniziata!';
      updateScores();
      generateBoardTiles();
      updateTurnUI();
      drawBoard();
    }

    // --- EVENT LISTENERS E AVVIO ---
    const catalogView = document.getElementById('catalogView');
    const gameView = document.getElementById('gameView');
    const spiralGameCard = document.getElementById('spiralGameCard');
    const scoreGameCard = document.getElementById('scoreGameCard');
    const backToCatalog = document.getElementById('backToCatalog');

    function showGame() {
      catalogView.style.display = 'none';
      gameView.style.display = 'flex';
      document.querySelector('.game-name').innerText = gameMode === 'score'
        ? 'Ventuno a scelta'
        : 'Spirale Party 3D';
      canvas.style.display = gameMode === 'score' ? 'none' : 'block';
      document.getElementById('scoreBoard').classList.toggle('visible', gameMode === 'score');
      requestAnimationFrame(() => {
        if (gameMode === 'spiral') {
          resizeCanvas();
          computeSpiralPoints();
        }
        drawBoard();
      });
    }

    function showCatalog() {
      gameView.style.display = 'none';
      catalogView.style.display = 'flex';
    }

    rollBtn.addEventListener('click', handleTurn);
    diceContainer.addEventListener('click', handleTurn);
    addAction.addEventListener('click', () => applyScoreAction('add'));
    subtractAction.addEventListener('click', () => applyScoreAction('subtract'));
    spiralGameCard.addEventListener('click', () => {
      gameMode = 'spiral';
      resetGame();
      showGame();
    });
    scoreGameCard.addEventListener('click', () => {
      gameMode = 'score';
      resetGame();
      showGame();
    });
    backToCatalog.addEventListener('click', showCatalog);

    window.addEventListener('resize', () => {
      resizeCanvas();
      computeSpiralPoints();
      drawBoard();
    });

    // Rileva cambi di dimensione del contenitore (rotazione, barre del browser mobile)
    if (window.ResizeObserver) {
      new ResizeObserver(() => {
        resizeCanvas();
        computeSpiralPoints();
        drawBoard();
      }).observe(canvas.parentElement);
    }

    generateBoardTiles();
    init3DDice();
    updateScores();
    updateTurnUI();
    showCatalog();
  </script>
</body>
</html>
